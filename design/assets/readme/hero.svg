    <text x="18" y="211" fill="#B51686" font-size="17" font-weight="600">3 агента</text>
    <rect x="178" y="184" width="188" height="42" rx="13" fill="#EAF8F3"/>
    <text x="196" y="211" fill="#00856F" font-size="17" font-weight="600">рынок в реальном времени</text>
  </g>
  <g transform="translate(748 68)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect width="368" height="226" rx="18" fill="#FCFAFD" stroke="#EDE8EF"/>
