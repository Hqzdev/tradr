    <text x="24" y="61" fill="#00856F" font-size="17" font-weight="600">$194,28  +1,43%</text>
    <line x1="24" y1="176" x2="344" y2="176" stroke="#EEE8EF"/>
    <path d="M24 162 L58 148 L92 154 L126 126 L160 138 L194 104 L228 116 L262 84 L296 95 L344 62" fill="none" stroke="#E91BAC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
