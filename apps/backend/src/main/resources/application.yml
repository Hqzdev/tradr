spring:
  application:
    name: tradr-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # схему двигает только Flyway, не Hibernate
    open-in-view: false     # выключено осознанно: маскирует N+1 и утечки транзакций
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Собственные настройки приложения (Phase 1) — читаются в JwtProperties и
# CorsProperties через @ConfigurationProperties. Список через запятую в
# CORS_ALLOWED_ORIGINS Spring сам разложит в List<String>.
app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
