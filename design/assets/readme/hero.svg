    <text x="0" y="70" fill="#131313" font-size="62" font-weight="700">TRADR</text>
    <text x="0" y="112" fill="#625B69" font-size="25">Торговая симуляция с агентами</text>
    <text x="0" y="148" fill="#77727D" font-size="19">Один рынок. Разные решения. Никаких реальных денег.</text>
