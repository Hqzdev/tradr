<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">TRADR — учебная торговая платформа</title>
  <desc id="desc">Светлая биржевая панель с динамикой цены, тремя торговыми агентами и контролем риска.</desc>
  <rect width="1200" height="360" rx="28" fill="#FCFAFD"/>
  <rect x="36" y="36" width="1128" height="288" rx="22" fill="#FFFFFF" stroke="#EDE8EF"/>
  <g transform="translate(76 78)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
